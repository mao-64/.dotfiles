}

# Sets the bar color in red for all windows that have 'myClass' as a class
#windowrule = plugin:hyprbars:no_bar class:^(title)

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, D, exec, bemenu-run
bind = $mainMod, C, exec, tofi-drun
bind = $mainMod SHIFT, Q, killactive, 
bind = $mainMod SHIFT, E, exit, 
#bind = $mainMod, E, exec, dolphin
bind = $mainMod, R, exec, wofi --show drun
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = , XF86Calculator, exec, kitty
bind = $mainMod, E, exec, emote

bind = $mainMod, SPACE, togglefloating, 
bind = $mainMod, F, fullscreen, 0

bind = $mainMod, S, togglespecialworkspace, scratch_pad

binde =, XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%+

binde =, XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.4 @DEFAULT_AUDIO_SINK@ 5%-

bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle


# Move focus with mainMod + arrow keys
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

#bind = $mainMod CTRL, 1, movecurrentworkspacetomonitor, eDP-1
#bind = $mainMod CTRL, 2, movecurrentworkspacetomonitor, eDP-1
#bind = $mainMod CTRL, 3, movecurrentworkspacetomonitor, eDP-1
#bind = $mainMod CTRL, 4, movecurrentworkspacetomonitor, eDP-1
#bind = $mainMod CTRL, 5, movecurrentworkspacetomonitor, eDP-1
#bind = $mainMod CTRL, 6, movecurrentworkspacetomonitor, eDP-1
#bind = $mainMod CTRL, 7, movecurrentworkspacetomonitor, eDP-1
#bind = $mainMod CTRL, 8, movecurrentworkspacetomonitor, eDP-1
#bind = $mainMod CTRL, 9, movecurrentworkspacetomonitor, eDP-1
#bind = $mainMod CTRL, 0, movecurrentworkspacetomonitor, eDP-1

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1



bind = $mainMod, U, movecurrentworkspacetomonitor, DP-1
bind = $mainMod, O, movecurrentworkspacetomonitor, DP-2
bind = $mainMod, I, movecurrentworkspacetomonitor, HDMI-A-1
#bind = $mainMod SHIFT, S, swapactiveworkspaces, eDP-1 HDMI-A-1

#bind = $mainMod, U, movewindow, mon:DP-1
#bind = $mainMod, O, movewindow, mon:DP-2
#bind = $mainMod, I, movewindow, mon:HDMI-A-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = , Print, exec, grim $HOME/Pictures/Screenshots/$(date +'%s_grim.png')
bind = $mainMod, Print, exec, grim -g "$(slurp -o)" $HOME/Pictures/Screenshots/$(date +'%s_grim.png')
bind = $mainMod CTRL, Print, exec, grim -g "$(slurp)" $HOME/Pictures/Screenshots/$(date +'%s_grim.png')

# This will toggle HyprExpo when SUPER+g is pressed
#bind = SUPER, g, hyprexpo:expo, toggle
