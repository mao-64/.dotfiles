autogenerated = 0 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,auto
#monitor=eDP-1,1920x1080@120, 0,1
#monitor=eDP-1,1920x1080@120, 2560x0,1
#monitor=HDMI-A-1,2560x1440@99, 0x0,1

monitor=DP-1,2560x1440@144, 0x0,1
monitor=DP-2,1920x1080@59, -1920x0,1
monitor=HDMI-A-1,3840x2160@60, -1300x-2160,1
#monitor=HDMI-A-1,3840x2160@60, 0x1128,1

#wsbind=6,eDP-1


#wsbind=1,HDMI-A-1
#wsbind=2,HDMI-A-1

#env = GTK_THEME,adwaita:dark
env = GTK_THEME,Nordic-darker-standard-buttons:dark

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch
# exec-once = waybar & hyprpaper & firefox
 exec-once = waybar & hyprpaper & nm-applet & /usr/bin/lxpolkit & mpd & flameshot & udiskie
#exec-once = waybar & hyprpaper & kitty -T "scratch_pad"




# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

	 repeat_rate = 25
	 repeat_delay = 300

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(fabd2fee) rgba(b79921ee) 45deg
    col.inactive_border = rgba(282828ee)

    layout = master
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 3
#    blur = yes
#    blur_size = 3
#    blur_passes = 1
#    blur_new_optimizations = on

#    drop_shadow = yes
#    shadow_range = 4
#    shadow_render_power = 3
#    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier, popin
    animation = windowsIn, 1, 7, default, popin
    animation = windowsOut, 1, 7, default, popin
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = yes # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = yes # you probably want this
}

master {
    # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#    new_is_master = false
#	 no_gaps_when_only = false
}

#gestures {
#    # See https://wiki.hyprland.org/Configuring/Variables/ for more
#    workspace_swipe = off
#}

misc {
	enable_swallow = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device:epic mouse V1 {
#    sensitivity = -0.5
}

#windowrulev2 = animation slidevert,workspace special scratch_pad,pin,float,title:^(scratch_pad)$
#
#windowrulev2 = nofocus,          class:^(?i)freecad.*$, xwayland:1
#windowrulev2 = no_initial_focus, class:^(?i)freecad.*$, xwayland:1
#
#windowrulev2 = nomousefocus, class:(?i)^(freecad.*|FreeCAD)$
#windowrulev2 = stayfocused,  class:(?i)^(freecad.*|FreeCAD)$   # opposite — sometimes paradoxically stabilizes focus

#windowrule = float, class:Tor Browser
#windowrule = float, ^(Tor Browser)$

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# .config/hypr/hyprland.conf
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(111111)
        workspace_method = center current # [center/first] [workspace] e.g. first 1 or center m+1

        gesture_distance = 300 # how far is the "max" for the gesture
    }

    split-monitor-workspaces {
        count = 5
        keep_focused = 0
        enable_notifications = 0
        enable_persistent_workspaces = 1

        # set this to 1 for gnome-like workspace switching
        link_monitors = 0

        # if you want a different monitor order
        monitor_priority = DP-1, DVI-D-1

        # you can also set max workspaces per monitor
        max_workspaces = DP-1, 10
        max_workspaces = DVI-D-1, 5
    }
#	 hyprbars {
